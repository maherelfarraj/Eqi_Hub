name: Verify Supabase replay inputs

on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/verify-supabase-replay.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/verify-supabase-replay.yml"

permissions:
  contents: read

jobs:
  supabase-replay:
    name: supabase-replay
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm run verify:supabase
