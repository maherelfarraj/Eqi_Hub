name: Verify Supabase replay inputs

on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/verify-supabase-*.mjs"
      - ".github/workflows/verify-supabase-replay.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/verify-supabase-*.mjs"
      - ".github/workflows/verify-supabase-replay.yml"

permissions:
  contents: read

jobs:
  supabase-replay:
    name: supabase-replay
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: npm run verify:supabase
