name: Verify Supabase replay inputs

on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/verify-supabase-*.mjs"
      - ".github/workflows/verify-supabase-replay.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/verify-supabase-*.mjs"
      - ".github/workflows/verify-supabase-replay.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run verify:supabase
