name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "artifacts/**"
      - "lib/**"
      - "scripts/**"
      - "docs/**"
      - "pilot/**"
      - "intelligence/**"
      - "EQUIVISTA_CANONICAL_ROADMAP.md"
      - ".npmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-verify:
    name: frontend-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      PORT: "4173"
      BASE_PATH: "/"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test production web server
        run: pnpm --filter @workspace/equus-voyages test:server
      - name: Verify controlled-pilot foundation
        run: pnpm verify:pilot && pnpm test:pilot && pnpm verify:batch6 && pnpm test:batch6 && pnpm verify:batch7 && pnpm test:batch7 && pnpm verify:batch8 && pnpm test:batch8 && pnpm verify:batch9 && pnpm test:batch9
      - name: Build
        run: pnpm build
