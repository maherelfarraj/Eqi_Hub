name: Repository Verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: repository-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supabase-preview-gate:
    name: supabase-preview-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Require a successful preview for Supabase changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "Supabase Preview is not required for a main push."
            exit 0
          fi
          if ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -q '^supabase/'; then
            echo "Supabase Preview intentionally skipped: this pull request has no supabase/ changes."
            exit 0
          fi
          trusted_evaluator_ref="$BASE_SHA"
          trusted_evaluator_dir="$(mktemp -d)"
          trap 'rm -rf "$trusted_evaluator_dir"' EXIT
          git show "$trusted_evaluator_ref:scripts/supabase-preview-check.mjs" \
            > "$trusted_evaluator_dir/supabase-preview-check.mjs"
          git show "$trusted_evaluator_ref:scripts/verify-supabase-preview-check.mjs" \
            > "$trusted_evaluator_dir/verify-supabase-preview-check.mjs"
          for attempt in $(seq 1 56); do
            all_checks='[]'
            for page in $(seq 1 20); do
              page_response="$(curl --fail --silent --show-error \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer $GITHUB_TOKEN" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$REPOSITORY/commits/$HEAD_SHA/check-runs?filter=all&per_page=100&page=$page")"
              page_checks="$(jq -c '.check_runs // []' <<<"$page_response")"
              page_count="$(jq 'length' <<<"$page_checks")"
              all_checks="$(jq -cn --argjson current "$all_checks" --argjson next "$page_checks" '$current + $next')"
              if [[ "$page_count" -lt 100 ]]; then
                break
              fi
              if [[ "$page" -eq 20 ]]; then
                echo "Supabase Preview check-run pagination exceeded the safe limit." >&2
                exit 1
              fi
            done
            checks="{\"check_runs\":$all_checks}"
            set +e
            printf '%s' "$checks" | node "$trusted_evaluator_dir/verify-supabase-preview-check.mjs"
            preview_status=${PIPESTATUS[1]}
            set -e
            if [[ "$preview_status" -eq 0 ]]; then
              echo "Expected Supabase App Preview succeeded."
              exit 0
            fi
            if [[ "$preview_status" -ne 3 ]]; then
              echo "Expected Supabase App Preview did not succeed." >&2
              exit 1
            fi
            echo "Waiting for the expected Supabase App Preview (attempt $attempt of 56)."
            sleep 15
          done
          echo "Supabase Preview was missing or did not complete successfully." >&2
          exit 1
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: supabase-preview-gate
    if: always()
    env:
      CI: "true"
      PORT: "4173"
      BASE_PATH: "/"
    steps:
      - name: Enforce the Supabase Preview gate
        if: needs.supabase-preview-gate.result != 'success'
        run: |
          echo "Supabase Preview gate did not succeed." >&2
          exit 1
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release integrity and Supabase controls
        run: pnpm verify
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
