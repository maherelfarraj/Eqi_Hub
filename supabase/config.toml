# Local and disposable-environment configuration only.
# Remote project linkage and secrets must stay outside version control.
project_id = "eqi_hub"

[db]
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[storage]
file_size_limit = "500MiB"

# Bucket rows are operational configuration, not schema DDL. Supabase recommends
# declaring them here because schema-only migration squashes omit bucket data.
[storage.buckets.avatars]
public = true

[storage.buckets.documents]
public = false

[storage.buckets."horse-photos"]
public = true

[storage.buckets."riding-analysis-videos"]
public = false
file_size_limit = "500MiB"
allowed_mime_types = ["video/mp4", "video/quicktime", "video/webm"]

[storage.buckets.videos]
public = false
file_size_limit = "500MiB"
allowed_mime_types = ["video/mp4", "video/quicktime", "video/webm"]
